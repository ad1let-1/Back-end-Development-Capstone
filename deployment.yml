apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: djangoserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "1"
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,djangoserver"
            - name: SONGS_SERVICE_URL
              value: "http://songs:8081"
            - name: PICTURES_SERVICE_URL
              value: "http://pictures:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
    - port: 8000
      targetPort: 8000
